[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "SpatialPerturb"
version = "0.3.0"
description = "AnnData-native framework for spatial perturbation inference across sequencing-based and imaging-based platforms."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "Taobo Hu" }]
keywords = ["spatial transcriptomics", "perturb-seq", "xenium", "scanpy", "gnn"]
dependencies = [
  "numpy>=1.22",
  "pandas>=1.5",
  "scipy>=1.9",
  "statsmodels>=0.14",
  "anndata>=0.10",
  "h5py>=3.8",
  "scanpy>=1.9",
  "scikit-learn>=1.2",
  "matplotlib>=3.6",
  "seaborn>=0.12",
  "networkx>=3.0",
  "tqdm>=4.64",
  "typer>=0.9"
]

[project.optional-dependencies]
gnn = [
  "torch>=2.1",
  "torch-geometric>=2.5"
]
full = [
  "omnipath>=1.0.12",
  "squidpy>=1.6"
]
interop = [
  "squidpy>=1.6",
  "omnipath>=1.0.12"
]

[project.scripts]
spatialperturb = "spatialperturb.cli:app"

[project.urls]
Homepage = "https://github.com/hutaobo/SpatialPerturb"
Issues = "https://github.com/hutaobo/SpatialPerturb/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
spatialperturb = ["py.typed", "resources/*.R"]

